global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: xiulijiu
    env: production

scrape_configs:
  - job_name: xiulijiu-api
    metrics_path: /metrics/prom
    scheme: https
    static_configs:
      - targets: ['api:8000']
        labels:
          service: api
    # 业务 JSON 端点由 alert_watcher 消费,这里只抓 Prometheus 格式

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
