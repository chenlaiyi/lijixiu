groups:
  - name: xiulijiu.app
    interval: 30s
    rules:
      # API 5xx 错误率(5 分钟内 > 5%)
      - alert: HighErrorRate
        expr: |
          (sum(rate(xiulijiu_http_requests_errors_total[5m]))
           / clamp_min(sum(rate(xiulijiu_http_requests_total[5m])), 1)) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx 错误率 > 5%(5 分钟)"
          description: "过去 5 分钟错误率 {{ $value | humanizePercentage }}"

      # P95 延迟 > 2s
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(xiulijiu_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P95 延迟 > 2s"
          description: "P95 延迟 {{ $value }}s"

      # 服务下线
      - alert: ServiceDown
        expr: up{job="xiulijiu-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API 服务下线"
          description: "xiulijiu-api 不可达"

      # 钱包对账差异(由 watcher 推钉钉;这里作为 Prom 兜底)
      - alert: WalletReconcileMismatch
        expr: xiulijiu_alerts_active_critical > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "钱包对账存在 critical 差异"
          description: "{{ $value }} 条 critical 告警未解决"

      # 订单长时间 pending(>30 分钟)
      - alert: OrdersStuck
        expr: xiulijiu_orders_pending > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "订单积压"
          description: "{{ $value }} 单 pending 超 30 分钟"

      # 2026-08-10:env 完整性
      # dev 模式 ok=false 也会告警,提示运维去补 secret
      - alert: EnvIncomplete
        expr: xiulijiu_env_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "env 配置不完整"
          description: "missing={{ $value }} / placeholders 存在,生产 deploy 前必须修"
      - alert: EnvHasPlaceholders
        expr: xiulijiu_env_placeholders > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "env 含 FILL_* 占位"
          description: "{{ $value }} 个 secret 仍是 FILL_*,需要去商户平台/平台拿真值"
