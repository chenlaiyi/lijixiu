user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 隐藏上游 Server / X-Powered-By
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 限速区(API 通用 + 登录防爆破)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    # === HTTP → HTTPS 重定向(只 listen 80 时生效)===
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # === HTTPS 主站 ===
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书(certs/ 下放 fullchain.pem + privkey.pem)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # === 安全 headers(2026-08-09 完整化)===
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # 防止 clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # MIME-sniffing 防护
        add_header X-Content-Type-Options "nosniff" always;
        # Referer 策略
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 旧 XSS 过滤器(向后兼容)
        add_header X-XSS-Protection "1; mode=block" always;
        # 内容安全策略(API + H5 通用,不允许 inline JS 除非白名单)
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # 浏览器功能限制
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        # 跨域(API 给 H5/小程序用,默认不允许跨域读取)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # HSTS preload 提交用(可选)
        add_header Expect-CT "enforce, max-age=86400" always;

        # === Swagger / Redoc / OpenAPI(仅管理员可访问)===
        location ~ ^/(docs|redoc|openapi.json|docs/oauth2-redirect)$ {
            auth_basic "Admin Only";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
            proxy_pass http://xiulijiu-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === 登录端点(限速防爆破)===
        location ~ ^/api/v1/auth/(wechat-login|sms/request|sms/login|review-login) {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://xiulijiu-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # === API(通用限速)===
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://xiulijiu-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # === 健康检查 ===
        location /health {
            proxy_pass http://xiulijiu-api:8000;
            access_log off;
        }

        # === Prometheus 指标(仅管理员)===
        location ~ ^/metrics(/prom)?$ {
            auth_basic "Metrics";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
            proxy_pass http://xiulijiu-api:8000;
        }

        # === H5 静态(可缓存)===
        location /h5/ {
            alias /app/h5/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # === Admin 后台(仅管理员)===
        location /admin/ {
            auth_basic "Admin";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
            alias /app/admin-web/;
            expires 1d;
        }

        # === 上传文件 ===
        location /uploads/ {
            alias /data/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
        }

        # === 默认(其他静态由 FastAPI 处理)===
        location / {
            proxy_pass http://xiulijiu-api:8000;
        }
    }
}
