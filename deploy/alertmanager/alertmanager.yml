global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: 'http://alert_watcher:3000/webhook'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: 'http://alert_watcher:3000/webhook/critical'
        send_resolved: true

# 把告警推回 alert_watcher(它会转钉钉/飞书)
